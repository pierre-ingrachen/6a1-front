name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - name: Garde de règles
        run: bash .githooks/run-guard.sh --all
      - name: Tests
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
      - name: Build
        run: npx ng build
