<svg viewBox="0 0 94 84" aria-hidden="true">
  <defs>
    <linearGradient [attr.id]="shadeId()" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.12" />
      <stop offset="1" stop-color="#000" stop-opacity="0.28" />
    </linearGradient>
    <pattern [attr.id]="textureId()" width="6" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <path d="M 3 0 V 9" stroke="#8fe39a" stroke-width="1.4" stroke-opacity="0.55" />
      <path d="M 0 4 V 9" stroke="#1f7d33" stroke-width="1.2" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <path
    class="body"
    [attr.fill]="fill()"
    d="M 31 3 Q 47 14 63 3 L 90 20 L 81 41 L 71 35 L 71 79 Q 47 85 23 79 L 23 35 L 13 41 L 4 20 Z"
  />
  @if (goalkeeper()) {
  <path
    [attr.fill]="'url(#' + textureId() + ')'"
    d="M 31 3 Q 47 14 63 3 L 90 20 L 81 41 L 71 35 L 71 79 Q 47 85 23 79 L 23 35 L 13 41 L 4 20 Z"
  />
  }
  <path
    [attr.fill]="'url(#' + shadeId() + ')'"
    d="M 31 3 Q 47 14 63 3 L 90 20 L 81 41 L 71 35 L 71 79 Q 47 85 23 79 L 23 35 L 13 41 L 4 20 Z"
  />
  <path class="collar" d="M 31 3 Q 47 14 63 3" />

  <text
    x="47"
    y="48"
    text-anchor="middle"
    class="number"
    [attr.fill]="textColor()"
    [attr.stroke]="textOutline()"
  >
    {{ number() }}
  </text>
</svg>
