<nav class="topbar">
  <div class="nav-shell">
    <div class="brand" routerLink="/" aria-label="Accueil">
      <img
        src="assets/logo_6a1.png"
        alt="Logo 6 à 1"
        style="width: 135px; height: 82.5px; object-fit: contain; flex-shrink: 0;"
      />
    </div>

    <mat-nav-list class="nav-links">
      @for (link of links; track link) {
      <a
        mat-list-item
        [routerLink]="link.href ? '/' + link.href : '/'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.href === '' }"
      >
        <span class="nav-link-content">
          <mat-icon>{{ link.icon }}</mat-icon>
          <span>{{ link.name }}</span>
        </span>
      </a>
      }
    </mat-nav-list>
  </div>
</nav>
