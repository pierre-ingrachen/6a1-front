<nav class="topbar">
  <div class="nav-shell">
    <div class="brand" routerLink="/" aria-label="Accueil">
      <img src="assets/logo_6a1.png" alt="Logo 6 à 1" />
      <div>
        <span class="brand-kicker">EPF</span>
        <h1>Six à un</h1>
      </div>
    </div>

    <mat-nav-list class="nav-links">
      @for (link of links; track link) {
      <a
        mat-list-item
        [routerLink]="link.href ? '/' + link.href : '/'"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.href === '' }"
      >
        <span>{{ link.name }}</span>
      </a>
      }
    </mat-nav-list>
  </div>
</nav>
