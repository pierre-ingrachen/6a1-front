<section class="draw">
  <header>
    <span class="kicker">Équipe tirée au sort</span>
    <h2>{{ draw().teamName }}</h2>
    <p>{{ draw().seasonLabel }} · {{ draw().country }}</p>
    <ng-content />
  </header>
  <div class="players">
    <app-bench-list
      [players]="orderedPlayers()"
      [slots]="slots()"
      [disabled]="disabled()"
      [selectedPlayerId]="selectedPlayerId()"
      (playerSelected)="playerSelected.emit($event)"
    />
  </div>
</section>
