<section class="draw">
  <header>
    <span class="kicker">Équipe tirée au sort</span>
    <h2>{{ draw().teamName }}</h2>
    <p>{{ draw().seasonLabel }} · {{ draw().country }}</p>
    <ng-content />
  </header>
  <div class="players">
    @for (group of groups(); track group.line) {
    <div class="group" [attr.data-line]="group.line">
      <h3>{{ group.label }}</h3>
      @for (player of group.players; track player.playerId) {
      <player-card
        [player]="player"
        [slots]="slots()"
        [disabled]="disabled()"
        (playerSelected)="playerSelected.emit($event)"
      />
      }
    </div>
    }
  </div>
</section>
