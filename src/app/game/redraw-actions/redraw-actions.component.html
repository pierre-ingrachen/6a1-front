<section class="redraws">
  <div class="quota">
    <span>Relances restantes</span>
    <strong [class.exhausted]="exhausted()">{{ redrawsRemaining() }}</strong>
  </div>
  <button type="button" class="season" [disabled]="disabled() || exhausted()" (click)="redrawRequested.emit('SEASON')">
    Autre année
  </button>
  <button type="button" class="team" [disabled]="disabled() || exhausted()" (click)="redrawRequested.emit('TEAM')">
    Autre équipe
  </button>
</section>
