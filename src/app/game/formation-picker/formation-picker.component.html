<section class="picker">
  <h2>Choisis ta formation</h2>
  <p>Clique sur une formation pour la voir sur le terrain.</p>
  <div class="formations">
    @for (formation of formations(); track formation.label) {
    <button
      type="button"
      class="formation"
      [class.selected]="formation.label === selected()"
      [attr.aria-pressed]="formation.label === selected()"
      [disabled]="disabled()"
      (click)="formationSelected.emit(formation.label)"
    >
      <strong>{{ formation.label }}</strong>
      @if (name(formation.label); as formationTitle) {
      <small class="nickname">{{ formationTitle }}</small>
      }
    </button>
    }
  </div>
</section>
