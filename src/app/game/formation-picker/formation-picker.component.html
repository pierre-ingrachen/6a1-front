<section class="picker">
  <h2>Choisis ta formation</h2>
  <div class="formations">
    @for (formation of formations(); track formation.label) {
    <button
      type="button"
      class="formation"
      [class.selected]="formation.label === selected()"
      [attr.aria-pressed]="formation.label === selected()"
      [disabled]="disabled()"
      (click)="formationSelected.emit(formation.label)"
    >
      <strong>{{ title(formation.label) }}</strong>
      @if (variant(formation.label); as formationVariant) {
      <small class="nickname">{{ formationVariant }}</small>
      }
    </button>
    }
  </div>
</section>
