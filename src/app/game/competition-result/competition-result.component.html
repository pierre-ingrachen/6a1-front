<section class="result">
  <header class="banner" [class.champion]="result().champion">
    <h2>{{ message().title }}</h2>
    <p>{{ message().subtitle }}</p>
    <small>
      Attaque {{ result().squadStrength.attack.toFixed(1) }} · Défense {{ result().squadStrength.defense.toFixed(1) }}
    </small>
  </header>

  <competition-recap
    [groupMatches]="groupSteps()"
    [knockoutMatches]="knockoutSteps()"
    [groupStage]="result().groupStage"
  />

  <button type="button" class="replay" (click)="replayRequested.emit()">Rejouer</button>
</section>
