<section class="simulation">
  @if (currentStep(); as step) {
  <div class="live">
    @for (displayed of [stepIndex()]; track displayed) {
    <match-card class="slide" [step]="step" [minute]="minute()" [kicksRevealed]="kicksRevealed()" />
    }

    <top-scorer-card [scorer]="topScorer()" />

    <div class="controls">
      @if (currentMatchFinished()) {
      <button type="button" (click)="goToNextMatch()">
        {{ lastMatch() ? "Voir le bilan" : "Match suivant" }}
      </button>
      } @else {
      <button type="button" class="secondary" (click)="skipClock()">Passer le match</button>
      } @if (canSkipGroupStage()) {
      <button type="button" class="secondary" (click)="skipGroupStage()">Passer la phase de poules</button>
      }
      <button type="button" class="secondary" (click)="skipAll()">Voir les résultats</button>
    </div>

    <div class="speeds" role="group" aria-label="Vitesse de simulation">
      @for (option of speeds; track option.id) {
      <button
        type="button"
        [class.active]="option.id === speed().id"
        [attr.aria-pressed]="option.id === speed().id"
        (click)="selectSpeed(option)"
      >
        {{ option.label }}
      </button>
      }
    </div>
  </div>
  }

  <competition-recap
    [groupMatches]="playedGroupSteps()"
    [knockoutMatches]="playedKnockoutSteps()"
    [groupStage]="groupStage()"
  />
</section>
