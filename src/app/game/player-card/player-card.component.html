<button
  type="button"
  class="card"
  [class.unavailable]="!selectable()"
  [class.selected]="selected()"
  [disabled]="disabled() || !selectable()"
  [attr.aria-pressed]="selected()"
  (click)="playerSelected.emit(player())"
>
  <div class="rating" [attr.data-tier]="tier()">
    <span>{{ player().rating }}</span>
    <small>NOTE</small>
  </div>
  <div class="identity">
    <strong>{{ player().name }}</strong>
    <span class="positions">
      @for (position of player().positions; track position) {
      <em [attr.title]="name(position)">{{ label(position) }}</em>
      }
    </span>
    @if (player().alreadyPicked) {
    <small>Déjà dans ton équipe</small>
    } @else if (!selectable()) {
    <small>Aucun poste libre pour ce joueur</small>
    } @else if (selected()) {
    <small>Choisis un poste compatible sur le terrain</small>
    } @else {
    <small>Clique pour choisir ce joueur</small>
    }
  </div>
  <div class="choices" aria-hidden="true">
    <span class="hint">Postes libres</span>
    @for (choice of choices(); track choice.slotIndex) {
    <span [attr.title]="name(choice.position)">{{ label(choice.position) }}</span>
    }
  </div>
</button>
