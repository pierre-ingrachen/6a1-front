<div class="pitch" role="list" aria-label="Ton équipe">
  @for (row of rows(); track row.line) {
  <div class="row">
    @for (slot of row.slots; track slot.index) {
    <button
      type="button"
      class="slot"
      role="listitem"
      [class.filled]="slot.player"
      [class.highlighted]="isHighlighted(slot) && !slot.player && selectedSlot() === null"
      [class.selected]="selectedSlot() === slot.index"
      [class.target]="isTarget(slot)"
      [class.draw-target]="isDrawTarget(slot)"
      [disabled]="isDisabled(slot)"
      [attr.title]="name(slot.position)"
      (click)="slotClicked.emit(slot.index)"
    >
      <span class="position">{{ label(slot.position) }}</span>
      @if (slot.player; as player) {
      <strong class="rating">{{ player.rating }}</strong>
      <span class="player-name">{{ player.name }}</span>
      <small>{{ player.teamName }} {{ player.seasonLabel }}</small>
      } @else {
      <span class="empty">?</span>
      }
    </button>
    }
  </div>
  }
</div>
