<div class="pitch" role="list" aria-label="Ton équipe">
  <app-pitch-lines />
  @for (placed of placedSlots(); track placed.slot.index) {
  <button
    type="button"
    class="slot"
    role="listitem"
    [style.left.%]="placed.x"
    [style.top.%]="placed.y"
    [class.filled]="placed.slot.player"
    [class.highlighted]="isHighlighted(placed.slot) && !placed.slot.player && selectedSlot() === null"
    [class.selected]="selectedSlot() === placed.slot.index"
    [class.target]="isTarget(placed.slot)"
    [class.draw-target]="isDrawTarget(placed.slot)"
    [disabled]="isDisabled(placed.slot)"
    [attr.title]="placed.slot.player ? placed.slot.player.name + ' · ' + placed.slot.player.teamName + ' ' + placed.slot.player.seasonLabel + ' · note ' + placed.slot.player.rating : name(placed.slot.position)"
    (click)="slotClicked.emit(placed.slot.index)"
  >
    <app-jersey
      class="jersey"
      [number]="placed.slot.player ? (jerseyNumbers().get(placed.slot.index) ?? '') : ''"
      [color]="placed.slot.player ? filledJerseyColor : emptyJerseyColor"
      [numberColor]="placed.slot.player ? filledNumberColor : emptyNumberColor"
      [goalkeeper]="placed.slot.line === 'GOALKEEPER' && placed.slot.player !== null"
    />
    <span class="label">{{ placed.slot.player ? shortName(placed.slot.player.name) : label(placed.slot.position) }}</span>
  </button>
  }
</div>
