<div class="d-flex align-items-center">
  <h1>Équipes</h1>
</div>
<table class="table table-hover">
  <thead>
    <tr>
      <th scope="col">Nom</th>
      <th scope="col">Pays</th>
    </tr>
  </thead>
  <tbody>
    @for (team of teams$ | async; track team.id) {
    <tr routerLink="/teams/{{ team.id }}">
      <td>{{ team.name }}</td>
      <td>{{ team.country }}</td>
    </tr>
    }
  </tbody>
</table>
