<section class="hero">
  <div class="hero-copy">
    <span class="eyebrow">Le football, en chiffres</span>
    <h1>Le jeu se raconte aussi par les stats.</h1>
    <p>
      Retrouvez les joueurs, leurs équipes et les performances qui font la
      différence sur le terrain.
    </p>
    <nav class="quick-links" aria-label="Accès rapides">
      @for (link of links; track link.href) {
      <a class="quick-link" [routerLink]="link.href">
        <mat-icon>{{ link.icon }}</mat-icon>
        <span class="quick-link-text">
          <strong>{{ link.title }}</strong>
          <small>{{ link.description }}</small>
        </span>
      </a>
      }
    </nav>
  </div>

  <dream-team />
</section>
